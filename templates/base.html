{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Custom Style CSS-->
    <link rel="stylesheet" href="{% static 'css/base_style.css' %}" />
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="{% static 'img/f4icon.ico' %}" sizes="16x16" type="image/x-icon"/>
	<link rel="stylesheet" href="{% static 'fonts/icomoon/style.css' %}">
    <link rel="stylesheet" href="{% static 'fonts/line-icons/style.css' %}">
    <!-- Lightbox CSS by wc -->
    <link rel="stylesheet" href="{% static 'css/lightbox.min.css' %}" />
    <!--link rel="stylesheet" href="{% static 'css/timeline.css' %}"-->
    <style>
        .no-underline {
          text-decoration: none;
        }
        .no-underline:hover {
          text-decoration: none;
        }
      </style>
    <title>Welcome to F4FC</title>
</head>
<body>
    <!--Navbar-->
    {% include "partials/_navbar.html" %}
    <!--Shopping Cart-->
    {% block shoppingCart %}{% endblock %}
    <!--Content-->
    {% block content %}{% endblock %}

    <!--partials/_footer.html-->
    {% include "partials/_footer.html" %}

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script 
    src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
    {% comment %} <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
    crossorigin="anonymous"></script> {% endcomment %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--Register Custom JS-->
    <script src="{% static 'js/lightbox.min.js' %}"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
          const requirementElement = document.getElementById("job-requirement");
          const text = requirementElement.textContent;
          // Split text by periods 
          const sentences = text.split(/(?<=[.])\s/);
          // Replace the content with formatted sentences
          requirementElement.innerHTML = sentences.map(sentence => `<span>${sentence}</span><br>`).join('');
      });
      
      document.addEventListener("DOMContentLoaded", function () {
            const requirementElement = document.getElementById("job-responsibilities");
            const text = requirementElement.textContent;
            // Split text by periods 
            const sentences = text.split(/(?<=[.])\s/);
            // Replace the content with formatted sentences
            requirementElement.innerHTML = sentences.map(sentence => `<span>${sentence}</span><br>`).join('');
        });
        
    </script>
</body>
</html>
